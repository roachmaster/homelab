prompt: "Defect investigation: when a coding-agent attempt fails, Forge discards the agent's raw output and records only a one-line generic summary, making the failure undiagnosable. Observed 2026-11-25: grok-primary implement attempt 979a6a9a (task bbd6bab5, workflow beb20249, GitHub issues #24/#27) failed after 12 minutes with the attempt summary 'The coding agent returned malformed Grok machine output.' - zero result chunks were stored, the failure event payload carried no detail, the worker and runner journals logged nothing about the parse failure, and the attempt's sandboxed session log (/run/forge-coding-attempt/grok-native.log) was destroyed when the worker stopped the session unit. The same pattern hit agy-primary attempt 6 of task 42fcaf63 the same evening (summary 'Agent invocation did not complete successfully', no cause, no output preserved). Investigate where each agent driver's output stream is parsed and where it is dropped on the failure path, and change the failure handling so a failed attempt preserves a bounded, redacted record of what the agent actually produced - at minimum the parser's specific complaint (which output line or rule failed) plus a bounded excerpt of the offending output - stored with the attempt before the sandbox is torn down, and visible through the existing attempt/result surfaces. Coordinate with the failure-cause work (task 21f9d7d6): cause codes say why in one line; this defect preserves the evidence behind the cause."
acceptance_criteria: "For a deliberately malformed agent output in tests, the failed attempt record carries the parser's specific complaint and a bounded excerpt of the offending output; the record survives session and sandbox teardown; excerpt bounds and redaction are enforced (no unbounded output, no credential-shaped strings stored); well-formed successful attempts are unchanged (same result chunks, same summaries); the failure event for such an attempt references the preserved record; coverage includes at least the Grok and AGY session execution paths that produced the two observed failures."
