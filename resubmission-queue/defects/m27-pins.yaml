prompt: "Fix forge-m27-update.py duplicating pin entries. The pin updater appends a new pin entry for a file instead of replacing the existing entry, so pin maps accumulate duplicates and later verification can resolve stale entries (observed across the proxy rounds: hand-applied pins had to be re-verified entry by entry because the tool's output could not be trusted). Change the updater to replace the existing entry for a file in place (same map, same key), preserving the file's formatting and unrelated entries, and add tests covering first pin, re-pin of an already-pinned file, and files present in more than one map -- only the chain-resolving entry is the live one, and the tool must report which entry it changed."
acceptance_criteria: "1. Re-running the updater for an already-pinned file yields exactly one entry for that file in the target map, with the new digest. 2. Re-processing the repo's existing pin files does not grow duplicate entries (idempotent). 3. The tool reports which map and entry it changed for each file. 4. Tests cover first-pin, re-pin, and multi-map files. 5. All 12 gates green on the candidate."
