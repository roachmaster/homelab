prompt: "Fix the 'lease lost' mislabel in the native coding worker. In work_worker.py the SQL renew returns False whenever the task status is NOT IN ('running','cancel_requested'), so when a task is cancelled the attempt cannot distinguish cancellation from an expired lease and reports 'lease lost' (renew handling around lines 243-263 and 346). The event stream then shows a lease failure for what was a deliberate cancellation. Change renew to return a distinguished outcome (renewed, lease_expired, task_cancelled, task_gone) and make the worker record and report cancellation as cancellation, ending the attempt without a lease-failure error."
acceptance_criteria: "1. Cancelling a task mid-attempt ends the attempt with a cancellation outcome recorded in the stream -- no 'lease lost' error for that attempt. 2. A genuinely expired lease still reports lease lost exactly as today. 3. Worker tests cover renew against running, cancel_requested, cancelled, and missing tasks. 4. No change to lease durations or renewal cadence. 5. All 12 gates green on the candidate."
