prompt: "Create a first-class defect flow in Forge. Today every submitted task is a feature-style work item; there is no way to file, mark, or track a defect (a bug found while developing) distinctly from planned work, so defects get mentioned in reports and lost. Add: (1) a defect marker on submission - the dispatch contract and the task record distinguish defect tasks from feature tasks, with structured defect fields captured at filing: summary of the malfunction, where it was observed (repo path/function and commit), observed vs expected behavior, severity, evidence, and an optional link to the discovering task/workflow; (2) defect tasks run the normal plan-implement-review flow, with the plan phase acting as triage (reproduce, root-cause, fix-or-defer recommendation); (3) the portal lists and badges defects distinctly, with a filter, and a workflow that files a defect shows the link; (4) migration and verify coverage following the existing patterns, and the submission API stays backward compatible for non-defect tasks. The discovering agent files the defect and keeps working - filing must be a single dispatch call with no extra ceremony."
acceptance_criteria: "Dispatch accepts a defect submission and rejects malformed defect fields with a clear error; the task record persists the defect marker and fields; a defect task flows plan-implement-review unchanged otherwise; the portal list API exposes the marker and fields and the UI badges defects with a working filter; non-defect submissions behave exactly as before; migrations apply cleanly and verify.sql passes at the new version; tests cover filing validation, persistence, flow, and portal exposure."
