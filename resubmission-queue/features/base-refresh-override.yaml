prompt: "Add a base-refresh override for external (muse-db) workflows. Problem: every muse-db task is claimed against a pinned base_revision and the finish contract requires the candidate to be built on exactly that base. Main moves several times a day, so the workflow queues a separate rebase task after almost every round -- the proxy workflow b3a05d8a alone burned three extra rebase rounds (bf080e2c, fddc4aa, 2ae4bae) and owes a fourth (the live round pins 2ae4bae while main is at 0ed8418) -- each costing a claim, a full gate run, and a review surface for a candidate whose content does not change. Design and implement an override: a new forge_external_agent_api operation (for example refresh_base) that the agent invokes itself before finish to re-pin its task's base to current main, allowed only when (1) the task is leased by the caller in an implement/revise phase with no candidate submitted this generation; (2) the new base is current main and a descendant of the pinned base; (3) merging the candidate onto the new base is conflict-free; (4) the candidate's diff against the new base equals its diff against the pinned base modulo main's own changes between the bases (pin re-acceptance caused purely by main-side file changes is the one allowed candidate-side delta and must be enumerated in the evidence); (5) the full gate suite passes on the refreshed tree, run after the refresh, with the evidence digest supplied by the caller and recorded; (6) one refresh per task generation. On any precondition failure the operation refuses and the existing flow is unchanged: submit on the pinned base and the workflow queues a rebase task. Every successful refresh writes, in the same transaction as the re-pin, a coding_events event carrying task and workflow ids, actor, old and new base, candidate commit and tree before and after, the main commits between the bases, the gate-evidence digest, and a reason; the same record is mirrored into the assignment receipt so the portal shows the base was refreshed by override. There is no path that changes a task's base without this event, and the event is written by the API function itself, not by the caller. No force-push; branch history stays append-only (merge-based refresh, as in the proxy retry round). Native workflows are out of scope. The plan phase produces the design (API shape, event kind, portal surfacing, migration if needed) for review before implementation."
acceptance_criteria: "1. An external agent can refresh its leased task's base to current main via the new API operation when all six preconditions hold, and finish then succeeds against the new base with no rebase task queued. 2. Each precondition failure (conflicting merge, candidate content drift beyond enumerated pin re-acceptance, stale or missing gate evidence, second refresh in the same generation, non-descendant base, candidate already submitted) refuses the refresh and leaves the pinned base and the existing flow untouched; each failure mode is covered by a test. 3. A successful refresh writes exactly one coding_events event in the same transaction as the re-pin, carrying actor, old and new base, candidate commit and tree before and after, the main commits between the bases, and the gate-evidence digest; no code path changes a task's base without that event. 4. The assignment receipt mirrors the override record and the portal task view shows the base was refreshed by override. 5. The existing submit-on-pinned-base and workflow-queued rebase paths behave exactly as before when the override is not used. 6. All 12 gates green on the candidate."
