prompt: "Update all Forge agents' instructions to follow the same branch setup Muse uses. Verified 2026-11-25: Muse works from a single persistent trunk branch (feature/muse) -- one branch per agent, never renamed or replaced, rebased onto main before pushing, with incremental pushes after tests pass and a locally managed build cache. The other agents have no equivalent instruction: the remote instead carries 32 forge/task-<uuid> branches created by the publication machinery, one per published task, including branches for work already merged that were never cleaned up. Change the instruction surfaces for every agent profile (agy-primary, codex-primary, muse-db-primary, and any other configured profile) so each agent is instructed to: keep one persistent named feature branch (feature/<agent>), never create per-task branches of its own, rebase onto current main before pushing, push incrementally after passing tests rather than in one final dump, and manage its own local build cache. Update the shared instruction documents and the per-profile configuration and templates wherever agent instructions live in the repo, keeping them consistent with each other. Where the publication machinery itself creates the per-task refs, the plan must say so explicitly and either align that behavior with the single-branch rule or document it as a named machinery-owned exception -- agent instructions must not promise branch behavior the machinery contradicts."
acceptance_criteria: "1. Every configured agent profile's instructions state the same branch rules: one persistent named feature branch per agent, no agent-created per-task branches, rebase onto main before pushing, incremental pushes after green tests, own local cache. 2. The shared instruction documents and the per-profile instructions agree with each other -- no conflicting branch guidance remains anywhere in the repo, verified by search. 3. The plan identifies where forge/task-<uuid> branches are created; that behavior is either aligned to the single-branch rule or documented in the instructions as a machinery-owned exception. 4. No change to any agent's permissions, or to recipe digests other than through the instruction content itself, or to the muse-db transport. 5. All 12 gates green on the candidate."
