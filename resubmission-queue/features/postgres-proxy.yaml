prompt: "Build the Postgres proxy microservice (forge-pg-proxy): a simple CRUD pass-through that becomes the only writer to the forge_agent database. The proxy exposes a small data-access API (DAO plus DTOs), authenticates each caller, enforces a per-caller allowlist of permitted operations, executes each write through the existing SECURITY DEFINER functions where they cover it, and records the actor (kind plus id) on every mutation. Keep the proxy to the API contract only: it cares about the API it exposes, nothing else. No rollback machinery, no constraint model, no extra internals. After the proxy is deployed and verified, direct table writes are blocked for every role except the proxy's own DB role. Include systemd supervision, a health endpoint, and tests for auth, allowlists, actor audit, and per-role grant verification."
acceptance_criteria: "1. The proxy exposes the data-access API (DAO plus DTOs) and is the only writer to forge_agent. 2. Every caller is authenticated; unauthenticated calls are rejected. 3. Each caller has an allowlist of permitted operations; unauthorized calls are rejected. 4. Every proxied write records the actor (kind plus id) and the operation in the audit log. 5. Writes reuse the existing SECURITY DEFINER functions where they cover the operation; no write logic is duplicated. 6. After rollout, a direct INSERT, UPDATE, or DELETE as forge_agent, forge_coding_worker, forge_coding_reconciler, or muse_events fails. 7. systemd supervision and a health endpoint are in place; caller behavior when the proxy is down is defined. 8. Tests cover auth, allowlists, actor audit, and per-role grant verification."
