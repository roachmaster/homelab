<svg xmlns="http://www.w3.org/2000/svg" width="128" height="176" viewBox="0 0 32 44"
     role="img" aria-labelledby="title description">
  <title id="title">Room One Scout, front view</title>
  <desc id="description">Front-facing gold helmet, cyan visor, cross-body strap, and a foreshortened probe.</desc>

  <defs>
    <linearGradient id="helmet" x1="8%" y1="12%" x2="92%" y2="94%">
      <stop offset="0" stop-color="#f5cb80"/>
      <stop offset=".54" stop-color="#e4a063"/>
      <stop offset="1" stop-color="#bb7254"/>
    </linearGradient>
    <linearGradient id="visor" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#326774"/>
      <stop offset=".5" stop-color="#244958"/>
      <stop offset="1" stop-color="#192f40"/>
    </linearGradient>
    <linearGradient id="coat" x1="8%" y1="12%" x2="92%" y2="95%">
      <stop offset="0" stop-color="#7299b0"/>
      <stop offset=".48" stop-color="#527699"/>
      <stop offset="1" stop-color="#354966"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="10%" y1="8%" x2="90%" y2="92%">
      <stop offset="0" stop-color="#637e9f"/>
      <stop offset=".55" stop-color="#495f7c"/>
      <stop offset="1" stop-color="#344962"/>
    </linearGradient>
    <linearGradient id="boot" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0" stop-color="#526989"/>
      <stop offset=".58" stop-color="#384963"/>
      <stop offset="1" stop-color="#293550"/>
