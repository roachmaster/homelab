# Standalone acceptance consumer, not a shipped framework application.
[package]
name = "template-public-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
rendering = ["dep:forge-template", "dep:forge-core"]

[dependencies]
forge-template = { path = "../..", optional = true }
forge-core = { path = "../../../forge-core", optional = true }
