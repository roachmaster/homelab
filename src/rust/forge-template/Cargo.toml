[package]
name = "forge-template"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Bounded, typed, schema-checked Mustache-like rendering"

[features]
default = []
# Marker feature: it gates the CLI module and the binary. Its contracts are
# forge-core modules now, always compiled, so it enables no dependency.
cli = []

[[bin]]
name = "forge-template"
path = "src/bin/forge-template.rs"
required-features = ["cli"]

[lints]
workspace = true

[dependencies]
forge-core.workspace = true

[dev-dependencies]
forge-core.workspace = true
