[package]
name = "forge-studio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Forge Studio: private game-project build control, signed preview listener and build worker over the forge_game schema (Rust port of deploy/mission-control/studio)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "forge-studio"
path = "src/bin/forge-studio.rs"
