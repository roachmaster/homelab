[package]
name = "forge-jenkins"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.89"

[features]
default = []
http = ["dep:ureq"]

[dependencies]
forge-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
base64 = "0.22"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }

[lints]
workspace = true
