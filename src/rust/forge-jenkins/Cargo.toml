[package]
name = "forge-jenkins"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
http = ["dep:ureq"]

[dependencies]
forge-bootstrap.workspace = true
forge-provider.workspace = true
forge-io-client.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }

[lints]
workspace = true
