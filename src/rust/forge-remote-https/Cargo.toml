[package]
name = "forge-remote-https"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-remote = { path = "../forge-remote" }
forge-bootstrap.workspace = true
forge-provider.workspace = true
forge-io-client.workspace = true
forge-ingress-contract.workspace = true
hyper = { version = "1.7", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1.48", features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
forge-kernel = { path = "../forge-kernel", default-features = false, features = ["node"] }
forge-task.workspace = true

[lints]
workspace = true
