[package]
name = "forge-remote-https"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
ide = ["dep:forge-ide"]
managed-writes = ["ide", "forge-ide/write-contract"]

[dependencies]
forge-ide = { path = "../forge-ide", default-features = false, features = ["remote"], optional = true }
forge-remote = { path = "../forge-remote" }
forge-core.workspace = true
hyper = { version = "1.7", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1.48", features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
forge-system = { path = "../forge-system", default-features = false, features = ["node"] }
forge-core.workspace = true

[lints]
workspace = true
