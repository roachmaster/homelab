# Separate public-API acceptance consumer, not an application shipped by Forge.
[package]
name = "remote-https-public-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
https = ["dep:forge-remote-https", "dep:forge-remote", "dep:forge-core", "dep:rcgen"]

ide = ["https", "forge-remote-https/ide", "dep:forge-ide"]

[dependencies]
forge-remote-https = { path = "../..", optional = true }
forge-remote = { path = "../../../forge-remote", optional = true }
forge-core = { path = "../../../forge-core", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"], optional = true }

forge-ide = {path="../../../forge-ide", default-features=false, features=["remote"], optional=true}
