[workspace]
members = ["forge-jenkins", "forge-ide-ui", "forge-ide-web", "forge-ide-web-host", "forge-game-runtime", "forge-agent", "forge-remote", "forge-remote-https", "forge-ide", "forge-template", "forge-core", "forge-system", "forge-local", "forge-terminal", "forge-jobs", "forge-mcp", "forge-mcp-host", "forge-postgres", "forge-work", "forge-work-worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forge-jenkins = { path = "forge-jenkins", default-features = false }
forge-core = { path = "forge-core" }
forge-mcp = { path = "forge-mcp" }
forge-postgres = { path = "forge-postgres" }
forge-work = { path = "forge-work" }
forge-work-worker = { path = "forge-work-worker" }

forge-system = { path = "forge-system" }

forge-local = { path = "forge-local", default-features = false }
