[workspace]
members = ["forge-jenkins", "forge-ide-ui", "forge-ide-web", "forge-ide-web-host", "forge-game-runtime", "forge-agent", "forge-remote", "forge-remote-https", "forge-ide", "forge-template", "forge-core", "forge-system", "forge-local", "forge-terminal", "forge-jobs", "forge-mcp", "forge-mcp-host", "forge-postgres", "forge-work", "forge-work-worker", "forge-work-publication", "forge-usage", "forge-agent-driver", "forge-services", "forge-portal-release-actor", "forge-studio", "forge-host", "forge-mcp-db"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forge-jenkins = { path = "forge-jenkins", default-features = false }
forge-core = { path = "forge-core" }
forge-mcp = { path = "forge-mcp" }
forge-postgres = { path = "forge-postgres" }
forge-work = { path = "forge-work" }
forge-work-worker = { path = "forge-work-worker" }
forge-work-publication = { path = "forge-work-publication" }
forge-usage = { path = "forge-usage" }
forge-agent-driver = { path = "forge-agent-driver" }
forge-services = { path = "forge-services" }
forge-portal-release-actor = { path = "forge-portal-release-actor" }
forge-studio = { path = "forge-studio" }
forge-host = { path = "forge-host" }
forge-mcp-db = { path = "forge-mcp-db" }

forge-system = { path = "forge-system" }

forge-local = { path = "forge-local", default-features = false }
