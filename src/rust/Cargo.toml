[workspace]
members = ["forge-jenkins", "forge-foundation", "forge-ide-ui", "forge-ide-web", "forge-ide-web-host", "forge-game-runtime", "forge-agent", "forge-remote", "forge-remote-https", "forge-ide", "forge-template", "forge-core", "forge-system", "forge-local", "forge-terminal", "forge-jobs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forge-jenkins = { path = "forge-jenkins", default-features = false }
forge-core = { path = "forge-core" }
forge-foundation = { path = "forge-foundation" }

forge-system = { path = "forge-system" }

forge-local = { path = "forge-local", default-features = false }
