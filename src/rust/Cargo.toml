[workspace]
members = ["forge-jenkins", "forge-llama", "forge-ide-ui", "forge-ide-web", "forge-ide-web-host", "forge-game-runtime", "forge-agent", "forge-remote", "forge-remote-https", "forge-ide", "forge-template", "forge-core", "forge-kernel", "examples/forge-demo-messages", "examples/forge-demo-memory-client", "examples/forge-bootstrap-demo", "forge-local", "forge-terminal", "forge-jobs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forge-jenkins = { path = "forge-jenkins", default-features = false }
forge-core = { path = "forge-core" }

forge-demo-messages = { path = "examples/forge-demo-messages" }
forge-demo-memory-client = { path = "examples/forge-demo-memory-client" }

forge-kernel = { path = "forge-kernel" }

forge-local = { path = "forge-local", default-features = false }
