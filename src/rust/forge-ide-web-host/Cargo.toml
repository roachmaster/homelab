[package]
name = "forge-ide-web-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-bootstrap.workspace = true
forge-provider.workspace = true
forge-task.workspace = true
forge-io-client.workspace = true
forge-ingress-contract.workspace = true
forge-bridge.workspace = true
forge-ide = { path = "../forge-ide", features = ["remote"] }
forge-ide-ui = { path = "../forge-ide-ui" }
forge-remote = { path = "../forge-remote" }
forge-remote-https = { path = "../forge-remote-https", features = ["ide"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
hyper = { version = "1.7", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1.48", features = ["rt", "net", "time"] }
getrandom = "0.4"
subtle = "2"
sha2 = "0.10"
ctrlc = { version = "=3.5.2", features = ["termination"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[lints]
workspace = true
