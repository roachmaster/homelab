[package]
name = "ide-public-consumer"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[features]
default = []
remote-inspection = ["inspection", "forge-ide/remote", "dep:forge-core", "dep:forge-remote"]
inspection = ["dep:forge-ide", "dep:forge-core"]
[dependencies]
forge-ide = { path = "../..", optional = true }
forge-core = { path = "../../../forge-core", optional = true }

forge-remote = { path = "../../../forge-remote", optional = true }
