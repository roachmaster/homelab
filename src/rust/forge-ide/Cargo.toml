[package]
name = "forge-ide"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
yaml = ["dep:serde", "dep:serde_yaml_ng"]
cli = ["yaml", "dep:forge-bridge", "dep:forge-ingress-contract", "dep:forge-command"]

[dependencies]
forge-bootstrap.workspace = true
forge-provider.workspace = true
forge-task.workspace = true
forge-io-client.workspace = true
forge-bridge = { workspace = true, optional = true }
forge-ingress-contract = { workspace = true, optional = true }
forge-command = { workspace = true, optional = true }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
syn = { version = "=2.0.118", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls", "extra-traits"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml_ng = { version = "=0.10.0", optional = true }

[[bin]]
name = "forge-ide"
path = "src/bin/forge-ide.rs"
required-features = ["cli"]

[lints]
workspace = true
