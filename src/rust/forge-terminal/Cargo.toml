[package]
name = "forge-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "forge"

[features]
default = ["disk", "jobs"]
disk = ["forge-local/disk"]
jobs = ["forge-local/jobs"]
durable-jobs = ["dep:forge-access", "dep:forge-ingress-contract", "dep:forge-jobs", "dep:ctrlc", "dep:nix"]
jenkins = ["forge-local/jenkins", "dep:forge-jenkins", "forge-jenkins/http", "dep:serde", "dep:serde_json", "dep:nix"]

[dependencies]
forge-local = { workspace = true, default-features = false }
forge-io-client.workspace = true
forge-bootstrap.workspace = true
forge-provider.workspace = true
forge-jenkins = { path = "../forge-jenkins", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
forge-access = { path = "../forge-access", optional = true }
forge-ingress-contract = { workspace = true, optional = true }
forge-jobs = { path = "../forge-jobs", optional = true }

[target.'cfg(unix)'.dependencies]
ctrlc = { version = "=3.5.2", features = ["termination"], optional = true }
nix = { version = "0.31", features = ["user"], optional = true }

[[bin]]
name = "forge"
path = "src/main.rs"

[[bin]]
name = "forge-jobs"
path = "src/bin/forge-jobs.rs"
required-features = ["durable-jobs"]

[lints]
workspace = true
