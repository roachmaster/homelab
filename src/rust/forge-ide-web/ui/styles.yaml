      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "minmax(240px,30%) minmax(0,1fr)"]
        - ["gap", "20px"]
        - ["align-items", "start"]
    - selector: ".fg-reader-layout .fg-tree"
      declarations:
        - ["max-height", "65dvh"]

- media: "(max-width:900px)"
  rules:
    - selector: ".fg-reader-layout:has(>:nth-child(2):not([hidden]))>:first-child"
      declarations:
        - ["display", "none"]

- rules:
    - selector: ".fg-reading-column .fg-toolbar"
      declarations:
        - ["padding", "0"]
        - ["border", "0"]
        - ["background", "transparent"]
    - selector: ".fg-reading-column .fg-field"
      declarations:
        - ["min-width", "0"]
    - selector: ".fg-reading-column select"
      declarations:
        - ["max-width", "min(100%,22rem)"]
        - ["text-overflow", "ellipsis"]
    - selector: ".fg-reading-column .fg-panel"
      declarations:
        - ["padding", "12px"]
    - selector: ".fg-reading-column .fg-panel>.fg-row:has(>button:not([hidden]))"
      declarations:
        - ["margin", "8px 0 0"]
    - selector: ".fg-reading-column .fg-panel>.fg-row:has(>button):not(:has(>button:not([hidden])))"
      declarations:
        - ["display", "none"]
    - selector: ".fg-reading-column .fg-tree"
      declarations:
        - ["max-height", "min(18rem,36dvh)"]
        - ["padding", "0"]
