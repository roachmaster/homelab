- rules:
    - selector: ".fg-reading-column"
      declarations:
        - ["width", "min(100%,56rem)"]
        - ["margin-inline", "auto"]
        - ["padding", "clamp(12px,3vw,28px)"]
        - ["display", "grid"]
        - ["gap", "12px"]
        - ["min-width", "0"]
    # The reader takes over on phones. Wide readers keep their index beside the content.
    - selector: ".fg-reading-column:has(>.fg-reader-layout)"
      declarations:
        - ["grid-template-columns", "minmax(0,1fr)"]
    - selector: ".fg-reader-layout,.fg-reader-layout>.fg-region"
      declarations:
        - ["min-width", "0"]
    - selector: ".fg-reader-layout>.fg-region:nth-child(2)"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "minmax(0,1fr)"]
        - ["gap", "12px"]
        - ["align-content", "start"]
    - selector: ".fg-reader-layout .fg-transcript"
      declarations:
        - ["max-height", "none"]
    - selector: ".fg-message-notice"
      declarations:
        - ["margin-top", "8px"]
        - ["font-size", "12px"]
        - ["color", "var(--warning)!important"]

- media: "(min-width:901px)"
  rules:
    - selector: ".fg-reading-column:has(>.fg-reader-layout)"
      declarations:
        - ["width", "min(100%,76rem)"]
