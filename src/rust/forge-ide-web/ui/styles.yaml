# Ordered Forge IDE styles. Rule and declaration order determines the cascade.
# Each declaration is a [property, value] pair.

- rules:
    - selector: "*"
      declarations:
        - ["box-sizing", "border-box"]
    - selector: "html"
      declarations:
        - ["color-scheme", "dark"]
    - selector: "body"
      declarations:
        - ["margin", "0"]
        - ["background", "var(--bg)"]
        - ["color", "var(--text)"]
        - ["font", "var(--font)/1.45 ui-sans-serif,system-ui,sans-serif"]
    - selector: "button,input,select,summary"
      declarations:
        - ["font", "inherit"]
    - selector: "button,input,select"
      declarations:
        - ["border", "1px solid var(--border)"]
        - ["border-radius", "var(--radius)"]
        - ["background", "var(--raised)"]
        - ["color", "var(--text)"]
        - ["min-height", "var(--control)"]
    - selector: "button"
      declarations:
        - ["padding", "4px 10px"]
        - ["cursor", "pointer"]
        - ["font-weight", "600"]
    - selector: "button:hover:enabled,summary:hover"
      declarations:
        - ["border-color", "var(--accent)"]
    - selector: "button:disabled"
      declarations:
        - ["background", "transparent"]
        - ["border-color", "transparent"]
        - ["color", "var(--muted)"]
        - ["cursor", "default"]
        - ["font-weight", "400"]
    - selector: ".fg-button-primary:enabled"
      declarations:
        - ["background", "var(--accent)"]
        - ["border-color", "var(--accent)"]
        - ["color", "var(--bg)"]
    - selector: ".fg-button-primary:hover:enabled"
      declarations:
        - ["filter", "brightness(1.08)"]
    - selector: ".fg-button-primary:focus-visible"
      declarations:
        - ["outline", "2px solid var(--text)"]
        - ["outline-offset", "3px"]
        - ["box-shadow", "0 0 0 2px var(--bg)"]
    - selector: ":focus-visible"
      declarations:
        - ["outline", "2px dashed var(--accent)"]
        - ["outline-offset", "-2px"]
    - selector: "input,select"
      declarations:
        - ["padding", "4px 8px"]
        - ["max-width", "100%"]
        - ["min-width", "0"]
    - selector: "h1,h2,h3,p"
      declarations:
        - ["margin", "0"]
    - selector: "h1"
      declarations:
        - ["font-size", "17px"]
        - ["letter-spacing", "-.4px"]
    - selector: "h2"
      declarations:
        - ["font-size", "12px"]
        - ["font-weight", "650"]
        - ["letter-spacing", ".15px"]
    - selector: "p"
      declarations:
        - ["overflow-wrap", "anywhere"]
    - selector: "p:not([role=status])"
      declarations:
        - ["color", "var(--muted)"]
    - selector: "[role=status]"
      declarations:
        - ["color", "var(--muted)"]
        - ["font-weight", "500"]
        - ["font-size", "12px"]
        - ["min-height", "28px"]
        - ["padding", "5px 12px"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["border-inline-start", "3px solid transparent"]
    - selector: "[data-bind-text][data-tone=accent]"
      declarations:
        - ["color", "var(--accent)"]
    - selector: "[data-bind-text][data-tone=warning]"
      declarations:
        - ["color", "var(--warning)"]
    - selector: "[data-bind-text][data-tone=error]"
      declarations:
        - ["color", "var(--error)"]
    - selector: "[role=status][data-tone=warning]"
      declarations:
        - ["border-inline-start-color", "var(--warning)"]
    - selector: "[role=status][data-tone=error]"
      declarations:
        - ["border-inline-start-color", "var(--error)"]
    - selector: ".fg-header"
      declarations:
        - ["min-height", "36px"]
        - ["padding", "5px 12px"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["justify-content", "space-between"]
        - ["gap", "var(--gap)"]
    - selector: ".fg-header>p"
      declarations:
        - ["font-size", "12px"]
    - selector: ".fg-brand"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["gap", "8px"]
    - selector: ".fg-brand-link"
      declarations:
        - ["display", "inline-flex"]
        - ["align-items", "center"]
        - ["gap", "8px"]
        - ["min-height", "var(--touch)"]
        - ["color", "var(--text)"]
        - ["text-decoration", "none"]
    - selector: ".fg-mark"
      declarations:
        - ["display", "grid"]
        - ["place-items", "center"]
        - ["width", "22px"]
        - ["height", "22px"]
        - ["border", "1px solid var(--accent)"]
        - ["color", "var(--accent)"]
        - ["font-weight", "800"]
        - ["border-radius", "var(--radius)"]
    - selector: ".fg-app"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "minmax(0,1fr)"]
        - ["gap", "0"]
    - selector: ".fg-screen"
      declarations:
        - ["min-width", "0"]
    - selector: ".fg-screen:not([data-protected])"
      declarations:
        - ["max-width", "680px"]
        - ["margin", "36px auto"]
        - ["padding", "0 16px"]
        - ["width", "100%"]
    - selector: ".fg-panel"
      declarations:
        - ["background", "var(--surface)"]
        - ["border", "1px solid var(--border)"]
        - ["border-radius", "var(--radius)"]
        - ["padding", "16px"]
        - ["min-width", "0"]
    - selector: ".fg-panel>h2"
      declarations:
        - ["margin-bottom", "12px"]
    - selector: ".fg-panel>p"
      declarations:
        - ["margin-bottom", "10px"]
    - selector: ".fg-row"
      declarations:
        - ["display", "flex"]
        - ["gap", "var(--gap)"]
        - ["align-items", "flex-end"]
        - ["flex-wrap", "wrap"]
        - ["margin", "10px 0"]
    - selector: ".fg-toolbar"
      declarations:
        - ["display", "flex"]
        - ["align-items", "end"]
        - ["gap", "var(--gap)"]
        - ["padding", "6px 10px"]
        - ["background", "var(--surface)"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["flex-wrap", "wrap"]
    - selector: ".fg-toolbar>p"
      declarations:
        - ["align-self", "center"]
        - ["font-size", "12px"]
        - ["margin-left", "auto"]
        - ["padding", "3px 8px"]
        - ["border", "1px solid currentColor"]
        - ["border-radius", "var(--radius)"]
    - selector: ".fg-field"
      declarations:
        - ["display", "grid"]
        - ["gap", "3px"]
        - ["min-width", "0"]
    - selector: ".fg-field>span"
      declarations:
        - ["font-size", "12px"]
        - ["color", "var(--muted)"]
        - ["font-weight", "600"]
        - ["letter-spacing", ".3px"]
    - selector: ".fg-field select"
      declarations:
        - ["width", "clamp(150px,18vw,260px)"]
        - ["text-overflow", "ellipsis"]
    - selector: ".fg-filter"
      declarations:
        - ["margin", "8px 10px"]
    - selector: ".fg-filter input"
      declarations:
        - ["width", "100%"]
    - selector: ".fg-pane-layout"
      declarations:
        - ["min-width", "0"]
    - selector: ".fg-layout-controls"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["gap", "8px"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["background", "var(--surface)"]
        - ["padding", "4px 10px"]
        - ["min-height", "34px"]
        - ["position", "relative"]
    - selector: ".fg-view-options summary"
      declarations:
        - ["cursor", "pointer"]
        - ["list-style-position", "inside"]
        - ["padding", "3px 7px"]
        - ["border", "1px solid var(--border)"]
        - ["border-radius", "var(--radius)"]
        - ["font-size", "12px"]
    - selector: ".fg-option-list"
      declarations:
        - ["position", "absolute"]
        - ["z-index", "5"]
        - ["top", "100%"]
        - ["left", "10px"]
        - ["display", "grid"]
        - ["gap", "5px"]
        - ["padding", "10px"]
        - ["background", "var(--raised)"]
        - ["border", "1px solid var(--border)"]
        - ["box-shadow", "0 8px 18px #0005"]
        - ["min-width", "190px"]
    - selector: ".fg-option-list button"
      declarations:
        - ["text-align", "left"]
    - selector: ".fg-option-list button[aria-expanded=true]::before"
      declarations:
        - ["content", "'✓ '"]
        - ["color", "var(--accent)"]
    - selector: ".fg-option-list button[aria-expanded=false]::before"
      declarations:
        - ["content", "'+ '"]
        - ["color", "var(--muted)"]
    - selector: ".fg-pane-switches"
      declarations:
        - ["display", "flex"]
        - ["gap", "4px"]
        - ["flex-wrap", "wrap"]
    - selector: ".fg-pane-switches button"
      declarations:
        - ["font-size", "12px"]
        - ["min-height", "26px"]
        - ["padding", "2px 9px"]
        - ["background", "transparent"]
        - ["border-color", "transparent"]
        - ["font-weight", "500"]
    - selector: ".fg-pane-switches button[aria-pressed=true]"
      declarations:
        - ["background", "var(--raised)"]
        - ["border-color", "var(--border)"]
        - ["color", "var(--text)"]
    - selector: "[data-narrow=false] .fg-pane-switches [data-pane-position=main]"
      declarations:
        - ["display", "none"]
    - selector: ".fg-panes"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "var(--leading-size,250px) var(--leading-divider,6px) minmax(0,1fr) var(--trailing-divider,6px) var(--trailing-size,280px)"]
        - ["grid-template-rows", "minmax(260px,1fr) var(--bottom-divider,6px) var(--bottom-size,170px)"]
        - ["height", "max(440px,calc(100dvh - 220px))"]
        - ["min-width", "0"]
    - selector: ".fg-pane"
      declarations:
        - ["background", "var(--surface)"]
        - ["min-width", "0"]
        - ["min-height", "0"]
        - ["display", "flex"]
        - ["flex-direction", "column"]
        - ["overflow", "hidden"]
    - selector: ".fg-pane-leading"
      declarations:
        - ["grid-area", "1/1"]
    - selector: ".fg-pane-main"
      declarations:
        - ["grid-area", "1/3"]
        - ["background", "var(--bg)"]
    - selector: ".fg-pane-trailing"
      declarations:
        - ["grid-area", "1/5"]
    - selector: ".fg-pane-bottom"
      declarations:
        - ["grid-area", "3/1/4/6"]
    - selector: ".fg-pane-header"
      declarations:
        - ["min-height", "32px"]
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["justify-content", "space-between"]
        - ["gap", "8px"]
        - ["padding", "4px 10px"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["background", "var(--raised)"]
    - selector: ".fg-pane-header h2"
      declarations:
        - ["min-width", "0"]
        - ["overflow-wrap", "anywhere"]
    - selector: ".fg-pane-header h2:focus-visible"
      declarations:
        - ["outline-offset", "3px"]
    - selector: ".fg-pane-close"
      declarations:
        - ["padding", "0 6px"]
        - ["border", "0"]
        - ["min-height", "24px"]
        - ["background", "transparent"]
        - ["color", "var(--muted)"]
        - ["font-size", "17px"]
    - selector: ".fg-pane-body"
      declarations:
        - ["overflow", "auto"]
        - ["min-height", "0"]
        - ["flex", "1"]
        - ["scrollbar-color", "var(--border) var(--surface)"]
        - ["padding-bottom", "8px"]
    - selector: ".fg-pane-body>p"
      declarations:
        - ["font-size", "12px"]
        - ["padding", "5px 10px"]
    - selector: ".fg-pane:not(.fg-pane-main)>.fg-pane-body"
      declarations:
        - ["display", "flex"]
        - ["flex-direction", "column"]
        - ["overflow", "auto"]
    - selector: ".fg-pane:not(.fg-pane-main)>.fg-pane-body>.fg-tree"
      declarations:
        - ["flex", "1"]
        - ["min-height", "28px"]
    - selector: ".fg-pane-body>.fg-filter,.fg-pane-body>.fg-caption,.fg-pane-body>.fg-row,.fg-pane-body>.fg-focus-name"
      declarations:
        - ["flex", "none"]
    - selector: ".fg-pane-body>.fg-row"
      declarations:
        - ["margin", "0"]
        - ["padding", "6px 8px"]
        - ["border-top", "1px solid var(--border)"]
        - ["gap", "4px"]
        - ["justify-content", "space-between"]
    - selector: ".fg-pane-body>.fg-row button"
      declarations:
        - ["font-size", "12px"]
        - ["padding", "4px 7px"]
        - ["font-weight", "500"]
    - selector: ".fg-pane-body>button"
      declarations:
        - ["margin", "4px 4px 4px 10px"]
        - ["font-size", "12px"]
    - selector: ".fg-pane-main>.fg-pane-body"
      declarations:
        - ["padding", "12px 16px"]
    - selector: ".fg-pane-main>.fg-pane-body>p"
      declarations:
        - ["padding", "0 0 10px"]
    - selector: ".fg-selection-heading"
      declarations:
        - ["font-size", "20px"]
        - ["font-weight", "650"]
        - ["color", "var(--text)"]
        - ["line-height", "1.3"]
        - ["max-height", "150px"]
        - ["overflow", "auto"]
        - ["white-space", "pre-wrap"]
        - ["overflow-wrap", "anywhere"]
        - ["margin-bottom", "8px"]
    - selector: ".fg-caption"
      declarations:
        - ["font-size", "12px"]
    - selector: ".fg-context"
      declarations:
        - ["font", "12px ui-monospace,monospace"]
    - selector: ".fg-pane-main .fg-panel"
      declarations:
        - ["margin-top", "12px"]
        - ["padding", "10px 0 0"]
        - ["background", "transparent"]
        - ["border", "0"]
        - ["border-top", "1px solid var(--border)"]
        - ["border-radius", "0"]
    - selector: ".fg-pane-main .fg-panel>h2"
      declarations:
        - ["margin-bottom", "10px"]
    - selector: ".fg-pane-main .fg-panel>.fg-caption"
      declarations:
        - ["padding", "0 0 8px"]
    - selector: ".fg-pane-main .fg-panel>.fg-tree"
      declarations:
        - ["padding", "0"]
    - selector: ".fg-separator"
      declarations:
        - ["background", "var(--border)"]
        - ["touch-action", "none"]
        - ["position", "relative"]
    - selector: ".fg-separator:hover,.fg-separator:focus-visible"
      declarations:
        - ["background", "var(--accent)"]
    - selector: ".fg-separator-leading"
      declarations:
        - ["grid-area", "1/2"]
        - ["cursor", "col-resize"]
    - selector: ".fg-separator-trailing"
      declarations:
        - ["grid-area", "1/4"]
        - ["cursor", "col-resize"]
    - selector: ".fg-separator-bottom"
      declarations:
        - ["grid-area", "2/1/3/6"]
        - ["cursor", "row-resize"]
    - selector: ".fg-separator::after"
      declarations:
        - ["content", "''"]
        - ["position", "absolute"]
        - ["inset", "30% 1px"]
        - ["border", "1px dotted var(--muted)"]
    - selector: ".fg-separator-bottom::after"
      declarations:
        - ["inset", "1px 46%"]
    - selector: ".fg-tree"
      declarations:
        - ["overflow", "auto"]
        - ["padding", "3px 5px"]
        - ["min-width", "0"]
        - ["scrollbar-color", "var(--border) var(--surface)"]
    - selector: ".fg-tree-row"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["gap", "1px"]
        - ["margin", "1px 0"]
        - ["min-width", "0"]
    - selector: ".fg-tree-row[data-selected=true]"
      declarations:
        - ["background", "var(--raised)"]
        - ["box-shadow", "inset 2px 0 var(--accent)"]
    - selector: ".fg-tree-row button"
      declarations:
        - ["background", "transparent"]
        - ["border", "0"]
        - ["font-weight", "400"]
        - ["text-align", "left"]
        - ["min-height", "var(--row)"]
        - ["padding", "3px 5px"]
        - ["border-radius", "0"]
    - selector: ".fg-row-select"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["gap", "7px"]
        - ["flex", "1"]
        - ["min-width", "0"]
    - selector: ".fg-row-label"
      declarations:
        - ["overflow", "hidden"]
        - ["text-overflow", "ellipsis"]
        - ["white-space", "nowrap"]
    - selector: ".fg-row-secondary"
      declarations:
        - ["font-size", "11px"]
        - ["color", "var(--muted)"]
        - ["margin-left", "auto"]
        - ["white-space", "nowrap"]
        - ["max-width", "46%"]
        - ["overflow", "hidden"]
        - ["text-overflow", "ellipsis"]
    - selector: ".fg-glyph"
      declarations:
        - ["display", "inline-grid"]
        - ["place-items", "center"]
        - ["min-width", "18px"]
        - ["height", "17px"]
        - ["border", "0"]
        - ["border-radius", "2px"]
        - ["font", "10px ui-monospace,monospace"]
        - ["color", "var(--accent)"]
        - ["flex", "none"]
    - selector: ".fg-toggle"
      declarations:
        - ["width", "19px"]
        - ["flex", "none"]
        - ["color", "var(--muted)"]
        - ["padding", "3px!important"]
    - selector: ".fg-toggle[hidden]"
      declarations:
        - ["display", "block!important"]
        - ["visibility", "hidden"]
    - selector: ".fg-focus-name"
      declarations:
        - ["max-height", "90px"]
        - ["overflow", "auto"]
        - ["white-space", "pre-wrap"]
        - ["border-top", "1px solid var(--border)"]
        - ["font", "11px ui-monospace,monospace"]
        - ["overflow-wrap", "anywhere"]
        - ["margin", "8px 5px 0"]
        - ["padding", "6px!important"]
        - ["min-height", "26px"]
    - selector: ".fg-focus-name:empty"
      declarations:
        - ["display", "none"]
    - selector: ".fg-pane:not(.fg-pane-main) .fg-focus-name"
      declarations:
        - ["height", "28px"]
        - ["min-height", "28px"]
        - ["max-height", "28px"]
    - selector: ".fg-pane:not(.fg-pane-main) .fg-focus-name:empty"
      declarations:
        - ["display", "block"]
        - ["visibility", "hidden"]
    - selector: ".fg-empty"
      declarations:
        - ["padding", "15px 8px"]
        - ["font-size", "12px"]
    - selector: ".fg-details"
      declarations:
        - ["margin", "0"]
        - ["overflow-wrap", "anywhere"]
    - selector: ".fg-property"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "minmax(110px,1fr) minmax(0,3fr)"]
        - ["border-bottom", "1px solid var(--border)"]
        - ["min-width", "0"]
    - selector: ".fg-details dt,.fg-details dd"
      declarations:
        - ["padding", "5px"]
        - ["margin", "0"]
        - ["white-space", "pre-wrap"]
        - ["max-height", "220px"]
        - ["overflow", "auto"]
        - ["min-width", "0"]
    - selector: ".fg-details dt"
      declarations:
        - ["color", "var(--muted)"]
        - ["font-size", "12px"]
    - selector: ".fg-details dd"
      declarations:
        - ["font-family", "ui-monospace,monospace"]
        - ["font-size", "12px"]
    - selector: ".fg-facts"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "repeat(auto-fit,minmax(180px,1fr))"]
        - ["gap", "12px 20px"]
    - selector: ".fg-facts>.fg-property"
      declarations:
        - ["display", "block"]
        - ["border", "0"]
    - selector: ".fg-facts dt,.fg-facts dd"
      declarations:
        - ["padding", "0"]
    - selector: ".fg-facts dt"
      declarations:
        - ["margin-bottom", "3px"]
    - selector: ".fg-facts dd"
      declarations:
        - ["font-size", "13px"]
    - selector: ".fg-screen[data-protected]>p"
      declarations:
        - ["padding", "5px 12px"]
        - ["font-size", "12px"]
        - ["border-bottom", "1px solid var(--border)"]
    - selector: ".fg-app>p:last-child"
      declarations:
        - ["font-size", "11px"]
        - ["padding", "5px 12px"]
        - ["border-top", "1px solid var(--border)"]
    - selector: ".fg-recovery"
      declarations:
        - ["margin", "24px"]
        - ["padding", "20px"]
        - ["border", "1px solid var(--error)"]
    - selector: ".fg-recovery button"
      declarations:
        - ["margin-top", "12px"]
    - selector: ".fg-workspace"
      declarations:
        - ["display", "grid"]
        - ["grid-template-columns", "var(--sidebar) 1fr var(--details)"]
        - ["gap", "var(--gap)"]
    - selector: "[hidden]"
      declarations:
        - ["display", "none!important"]
    - selector: "[data-narrow=true] .fg-pane-switches"
      declarations:
        - ["display", "flex"]
        - ["gap", "4px"]
        - ["flex-wrap", "wrap"]
    - selector: "[data-narrow=true] .fg-pane-switches button"
      declarations:
        - ["font-size", "11px"]
        - ["padding", "3px 7px"]
    - selector: "[data-narrow=true] .fg-pane-switches button[aria-pressed=true]"
      declarations:
        - ["border-color", "var(--accent)"]
        - ["color", "var(--accent)"]
    - selector: "[data-narrow=true] .fg-panes"
      declarations:
        - ["display", "block"]
        - ["height", "max(440px,calc(100dvh - 250px))"]
    - selector: "[data-narrow=true] .fg-pane"
      declarations:
        - ["height", "100%"]
    - selector: "[data-narrow=true] .fg-separator"
      declarations:
        - ["display", "none"]
    - selector: "[data-narrow=true] .fg-layout-controls"
      declarations:
        - ["flex-wrap", "wrap"]

- media: "(max-width:800px)"
  rules:
    - selector: ".fg-header"
      declarations:
        - ["padding", "7px 10px"]
    - selector: ".fg-header>p"
      declarations:
        - ["display", "none"]
    - selector: ".fg-toolbar"
      declarations:
        - ["gap", "6px"]
    - selector: ".fg-toolbar .fg-field"
      declarations:
        - ["flex", "1"]
        - ["min-width", "120px"]
    - selector: ".fg-toolbar .fg-field select"
      declarations:
        - ["width", "100%"]
    - selector: ".fg-toolbar>p"
      declarations:
        - ["margin", "0"]
        - ["margin-left", "auto"]
    - selector: ".fg-pane-main>.fg-pane-body"
      declarations:
        - ["padding", "12px"]
