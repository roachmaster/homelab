        - ["align-content", "center"]
        - ["min-height", "120px"]
    - selector: "#workspace .fg-tree>.fg-empty"
      declarations:
        - ["text-align", "center"]
        - ["color", "var(--muted)"]
    - selector: ".fg-sheet"
      declarations:
        - ["position", "fixed"]
        - ["inset", "auto 0 0"]
        - ["margin", "0 auto"]
        - ["width", "min(100%,32rem)"]
        - ["max-width", "100%"]
        - ["max-height", "80dvh"]
        - ["padding", "16px 16px max(20px,env(safe-area-inset-bottom))"]
        - ["overflow-y", "auto"]
        - ["border", "1px solid rgba(255,255,255,.1)"]
        - ["border-bottom", "0"]
        - ["border-radius", "20px 20px 0 0"]
        - ["background", "var(--surface)"]
        - ["color", "var(--text)"]
        - ["box-shadow", "0 -8px 32px #0005"]
        - ["overscroll-behavior", "contain"]
    - selector: ".fg-sheet::backdrop"
      declarations:
        - ["background", "rgba(0,0,0,.6)"]
    - selector: ".fg-sheet-header"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["justify-content", "space-between"]
