        - ["padding", "9px 12px"]
        - ["background", "var(--raised)"]
        - ["border", "1px solid var(--border)"]
        - ["border-radius", "var(--radius)"]
    - selector: ".fg-stacked-tree .fg-row-select:hover:enabled,.fg-stacked-tree [data-selected=true] .fg-row-select"
      declarations:
