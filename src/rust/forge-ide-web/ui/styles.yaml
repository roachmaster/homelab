      declarations:
        - ["transform", "rotate(-135deg)"]
    - selector: ".fg-flow-hops"
      declarations:
        - ["list-style", "none"]
        - ["margin", "6px 0 0"]
        - ["padding", "0"]
        - ["display", "grid"]
        - ["gap", "6px"]
        - ["min-width", "0"]
    - selector: ".fg-flow-hop"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["flex-wrap", "wrap"]
        - ["gap", "6px 8px"]
        - ["padding", "6px 8px"]
        - ["border-radius", "8px"]
        - ["background", "var(--bg)"]
        - ["border", "1px solid rgba(255,255,255,.06)"]
        - ["min-width", "0"]
    - selector: ".fg-flow-hop-seq"
      declarations:
        - ["font", ".75rem ui-monospace,SFMono-Regular,monospace"]
        - ["color", "var(--muted)"]
        - ["font-variant-numeric", "tabular-nums"]
    - selector: ".fg-flow-hop-exact"
      declarations:
        - ["font", ".6875rem ui-monospace,SFMono-Regular,monospace"]
        - ["color", "var(--muted)"]
        - ["font-variant-numeric", "tabular-nums"]
        - ["overflow-wrap", "anywhere"]
    - selector: ".fg-flow-hop-detail"
      declarations:
        - ["font-size", ".75rem"]
        - ["color", "var(--muted)"]
        - ["overflow-wrap", "anywhere"]
        - ["flex", "1 1 160px"]
        - ["min-width", "0"]
- media: "(max-width:639px)"
  rules:
    - selector: "#agents-stage-panel"
      declarations:
        - ["padding", "12px"]
    - selector: ".fg-flow-track"
      declarations:
        - ["flex-direction", "column"]
        - ["align-items", "stretch"]
        - ["gap", "0"]
    - selector: ".fg-flow-step"
      declarations:
        - ["flex-direction", "column"]
        - ["align-items", "stretch"]
        - ["width", "100%"]
    - selector: ".fg-flow-node"
      declarations:
        - ["width", "100%"]
        - ["min-width", "0"]
        - ["max-width", "none"]
    - selector: ".fg-flow-connector"
      declarations:
        - ["width", "100%"]
        - ["height", "22px"]
        - ["padding", "0"]
    - selector: ".fg-flow-connector svg"
      declarations:
        - ["transform", "rotate(90deg)"]
- media: "(prefers-reduced-motion:reduce)"
  rules:
    - selector: ".fg-flow-node,.fg-flow-trace>summary,.fg-flow-trace>summary::after"
      declarations:
        - ["transition", "none"]
