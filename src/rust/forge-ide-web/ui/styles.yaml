      declarations:
        - ["content", "''"]
        - ["grid-column", "2"]
        - ["grid-row", "1 / span 2"]
        - ["justify-self", "center"]
        - ["width", "6px"]
        - ["height", "6px"]
        - ["border", "solid var(--accent)"]
        - ["border-width", "0 1.5px 1.5px 0"]
        - ["transform", "rotate(-45deg)"]

- media: "(min-width:901px)"
  rules:
