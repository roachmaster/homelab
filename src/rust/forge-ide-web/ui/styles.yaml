      declarations:
        - ["display", "none"]
    - selector: ".fg-reading-column button[aria-expanded=true]"
      declarations:
        - ["border-color", "var(--accent)"]
        - ["color", "var(--accent)"]
    # A flat summary stays readable when its title or metadata wraps.
    - selector: ".fg-reading-column .fg-stacked-tree"
      declarations:
        - ["max-height", "none"]
        - ["overflow", "visible"]
    - selector: ".fg-stacked-tree .fg-tree-row"
      declarations:
        - ["margin", "0 0 8px"]
        - ["border-radius", "var(--radius)"]
    - selector: ".fg-stacked-tree .fg-row-select"
      declarations:
        - ["display", "grid"]
