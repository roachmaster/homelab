        - ["top", "1px"]
        - ["left", "2px"]
        - ["width", "6px"]
        - ["height", "3px"]
        - ["border", "1px solid currentColor"]
        - ["border-bottom", "0"]
        - ["border-radius", "1px 1px 0 0"]
    - selector: ".fg-pane-main .fg-tree-row button"
      declarations:
        - ["min-height", "28px"]
    - selector: ".fg-pane-main .fg-row-secondary"
      declarations:
        - ["max-width", "48%"]
    - selector: ".fg-region"
      declarations:
        - ["min-width", "0"]
        - ["min-height", "0"]
    - selector: ".fg-pane:not(.fg-pane-main)>.fg-pane-body>.fg-region"
