# Workbench keeps project choices in the identity bar and the file area dominant.
- rules:
    - selector: "#ide-header-actions"
      declarations:
        - ["display", "flex"]
        - ["align-items", "center"]
        - ["flex", "1"]
        - ["min-width", "0"]
    - selector: "#workbench-header-actions"
      declarations:
