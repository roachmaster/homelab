      declarations:
        - ["width", "100%"]
        - ["min-height", "44px"]
        - ["padding", "10px 12px"]
        - ["border", "1px solid rgba(255,255,255,.08)"]
        - ["border-radius", "10px"]
        - ["text-align", "left"]
    - selector: ".fg-sheet-body>button[data-pane-toggle]::before"
      declarations:
        - ["content", "'+ '"]
        - ["color", "var(--muted)"]
    - selector: ".fg-sheet-body>button[data-pane-toggle][aria-expanded=true]::before"
      declarations:
        - ["content", "'✓ '"]
        - ["color", "var(--accent)"]
    - selector: ".fg-sheet .fg-field"
      declarations:
        - ["gap", "6px"]
        - ["margin-bottom", "16px"]
    - selector: ".fg-sheet .fg-field>span"
      declarations:
        - ["font-size", "12px"]
    - selector: ".fg-sheet :is(input,select)"
      declarations:
        - ["width", "100%"]
        - ["min-height", "44px"]
        - ["max-width", "none"]
    - selector: ".fg-sheet .fg-option-list"
      declarations:
        - ["position", "static"]
        - ["padding", "0"]
        - ["background", "transparent"]
        - ["border", "0"]
        - ["box-shadow", "none"]
        - ["min-width", "0"]
    - selector: ".fg-sheet .fg-option-list>button"
      declarations:
        - ["min-height", "44px"]
        - ["padding", "10px 12px"]
        - ["border-color", "rgba(255,255,255,.08)"]
        - ["border-radius", "10px"]
        - ["text-align", "left"]

- media: "(max-width:800px)"
  rules:
    - selector: "#workspace[data-narrow=true]>.fg-panes"
      declarations:
        - ["height", "auto"]
        - ["min-height", "0"]
        - ["grid-template-rows", "minmax(0,1fr)"]
    - selector: "#workspace[data-narrow=true] .fg-pane-header"
      declarations:
        - ["display", "none"]
    - selector: "#workspace[data-narrow=true] #file-heading>#back-to-files"
      declarations:
        - ["display", "grid"]
        - ["flex", "none"]
        - ["width", "44px"]
        - ["height", "44px"]
        - ["border", "0"]
        - ["border-radius", "8px"]
        - ["background", "transparent"]
    - selector: "#workspace[data-narrow=true] #file-heading>#back-to-files:hover"
      declarations:
        - ["background", "var(--raised)"]
    - selector: "#workspace[data-narrow=true] #selection-title"
      declarations:
        - ["font-size", "16px"]
        - ["line-height", "1.3"]
    - selector: "#workspace[data-narrow=true] .fg-pane-main>.fg-pane-body"
      declarations:
        - ["padding", "8px 12px"]
    - selector: "#workspace[data-narrow=true] .fg-tree-row"
      declarations:
        - ["margin-block", "0"]
    - selector: "#workspace[data-narrow=true] .fg-tree-row button"
      declarations:
        - ["min-height", "44px"]
        - ["padding-block", "4px"]
    - selector: "#workspace[data-narrow=true] .fg-pane-switches"
      declarations:
        - ["flex", "1"]
    - selector: "#workspace[data-narrow=true] .fg-pane-switches>button"
      declarations:
        - ["flex", "1 1 auto"]
        - ["min-width", "0"]
        - ["padding-inline", "6px"]
    - selector: "#workspace[data-narrow=true] #source-panel"
      declarations:
        - ["margin-top", "8px"]
    - selector: "#workspace[data-narrow=true] #source-panel>h2"
      declarations:
        - ["font-size", "12px"]
    - selector: "#workspace[data-narrow=true] #workspace-summary[data-tone=neutral]"
      declarations:
        - ["display", "none"]

- media: "(max-width:639px)"
  rules:
    - selector: "body:has(#workbench:not([hidden])) .fg-brand-link"
      declarations:
        - ["width", "44px"]
        - ["min-width", "44px"]
        - ["justify-content", "center"]
    - selector: "body:has(#workbench:not([hidden])) .fg-brand-link>h1"
      declarations:
        - ["position", "absolute"]
        - ["width", "1px"]
        - ["height", "1px"]
        - ["overflow", "hidden"]
        - ["clip-path", "inset(50%)"]
        - ["white-space", "nowrap"]

- media: "(min-width:801px)"
  rules:
    - selector: ".fg-sheet"
      declarations:
        - ["inset", "50% auto auto 50%"]
        - ["margin", "0"]
        - ["transform", "translate(-50%,-50%)"]
        - ["border-bottom", "1px solid rgba(255,255,255,.1)"]
        - ["border-radius", "16px"]

- media: "(prefers-reduced-motion:reduce)"
  rules:
    - selector: "#workbench-header-actions>button"
      declarations:
        - ["transition", "none"]


# A short landscape tree still needs room for one full touch row and its padding.
- media: "(max-width:800px) and (max-height:500px)"
  rules:
    - selector: "#workspace[data-narrow=true] .fg-pane-body"
      declarations:
        - ["overflow-y", "auto"]
    - selector: "#workspace[data-narrow=true] .fg-tree"
      declarations:
        - ["min-height", "50px"]

# Agents dashboard: task state, quota and project usage remain separate.
- rules:
    - selector: "#agents:not([hidden])"
      declarations:
        - ["display", "block"]
        - ["min-height", "0"]
        - ["overflow-y", "auto"]
