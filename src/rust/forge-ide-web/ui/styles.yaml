        - ["margin-bottom", "16px"]
    - selector: ".fg-sheet-header h2"
      declarations:
        - ["font-size", "18px"]
        - ["font-weight", "650"]
    - selector: ".fg-sheet-close"
      declarations:
        - ["flex", "none"]
        - ["min-width", "44px"]
        - ["min-height", "44px"]
        - ["padding", "0"]
        - ["border", "0"]
        - ["border-radius", "50%"]
        - ["background", "transparent"]
        - ["color", "var(--text)"]
        - ["font-size", "23px"]
    - selector: ".fg-sheet-close:hover"
      declarations:
        - ["background", "var(--raised)"]
    - selector: ".fg-sheet-body"
      declarations:
