[package]
name = "forge-ide-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
build-assets = ["dep:forge-bootstrap", "dep:forge-provider", "dep:forge-template", "dep:serde_yaml_ng", "dep:sha2"]

[dependencies]
forge-ide-ui = { path = "../forge-ide-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge-bootstrap = { path = "../forge-bootstrap", optional = true }
forge-provider = { path = "../forge-provider", optional = true }
forge-template = { path = "../forge-template", optional = true }
serde_yaml_ng = { version = "=0.10.0", optional = true }
sha2 = { version = "0.10", optional = true }

[[bin]]
name = "forge-ui-assets"
path = "src/bin/forge-ui-assets.rs"
required-features = ["build-assets"]

# Raw WASM export attributes require a documented allow at each export. All
# ordinary code remains deny; no unchecked pointer dereference is permitted.
[lints.rust]
unsafe_code = "deny"
