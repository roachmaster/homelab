[package]
name = "forge-llama"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-bootstrap.workspace = true
forge-bridge.workspace = true
forge-ingress-contract.workspace = true
forge-provider.workspace = true
hyper = { version = "1.7", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1.48", features = ["rt", "net", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
ctrlc = { version = "=3.5.2", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true
