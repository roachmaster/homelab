[package]
name = "forge-ci-verifier"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-core.workspace = true
forge-jenkins.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.30", features = ["fs", "user", "process", "signal", "sched", "time"] }
ctrlc = { version = "3", features = ["termination"] }

[lints]
workspace = true

[[bin]]
name = "forge-ci-check"
path = "src/bin/forge-ci-check.rs"

[[bin]]
name = "forge-native-ci-check"
path = "src/bin/forge-native-ci-check.rs"

[[bin]]
name = "forge-ci-build-child"
path = "src/bin/forge-ci-build-child.rs"
