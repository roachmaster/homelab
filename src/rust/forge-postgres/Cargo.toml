[package]
name = "forge-postgres"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.89"
description = "Dedicated Postgres adapter for Forge stores: a synchronous facade over tokio-postgres speaking the forge_coding_worker_api and forge_coding_reconciler_api SQL surfaces directly. Rust stores do not route through the forge-pg-proxy service."

[lints]
workspace = true

[dependencies]
forge-core.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = "1"
