name: Rust CI

on:
  push:
    branches: [main]
    paths: ['Makefile', 'src/rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Makefile', 'src/rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Select stable Rust and check components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Shared repository quality gates
        run: make ci
