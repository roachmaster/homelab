name: Rust CI

on:
  push:
    branches: [main, validation/forge-ide-ui]
    paths: ['Makefile', 'src/rust/**', 'src/python/game-assets/**', 'src/python/pixel-art/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Makefile', 'src/rust/**', 'src/python/game-assets/**', 'src/python/pixel-art/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Select stable Rust and check components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Add the browser WASM target and check Node
        run: |
          rustup target add wasm32-unknown-unknown
          node --version
      - name: Fetch locked optional capability dependencies
        run: cargo fetch --manifest-path src/rust/Cargo.toml --locked
      - name: Install game asset cooker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdk-pixbuf2.0-bin librsvg2-common imagemagick
      - name: Verify game asset cooking and pixel-art exports
        run: |
          python3 -B -m unittest discover -s src/python/game-assets/tests -v
          python3 -B -m unittest discover -s src/python/pixel-art/tests -v
      - name: Shared repository quality gates
        run: make ci
