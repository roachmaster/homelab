name: IDE browser acceptance

on:
  push:
    branches: [main, validation/forge-ide-ui]
    paths: ['src/rust/forge-ide-ui/**', 'src/rust/forge-ide-web/**', 'src/rust/forge-ide-web-host/**', 'src/rust/forge-agent/**', 'src/rust/forge-ide/**', 'src/rust/forge-remote*/**', 'src/rust/Cargo.*', 'src/rust/forge-bootstrap/**', 'src/rust/forge-provider/**', 'src/rust/forge-bridge/**', 'src/rust/forge-ingress-contract/**', 'src/rust/forge-task/**', 'src/rust/forge-io-client/**', 'src/rust/forge-template/**', 'Makefile', 'src/rust/scripts/ui_tools.py', 'src/rust/scripts/ui_qa.py', 'src/rust/scripts/tests/test_ui_qa.py', '.github/workflows/ide-ui-browser.yml']
  pull_request:
    paths: ['src/rust/forge-ide-ui/**', 'src/rust/forge-ide-web/**', 'src/rust/forge-ide-web-host/**', 'src/rust/forge-agent/**', 'src/rust/forge-ide/**', 'src/rust/forge-remote*/**', 'src/rust/Cargo.*', 'src/rust/forge-bootstrap/**', 'src/rust/forge-provider/**', 'src/rust/forge-bridge/**', 'src/rust/forge-ingress-contract/**', 'src/rust/forge-task/**', 'src/rust/forge-io-client/**', 'src/rust/forge-template/**', 'Makefile', 'src/rust/scripts/ui_tools.py', 'src/rust/scripts/ui_qa.py', 'src/rust/scripts/tests/test_ui_qa.py', '.github/workflows/ide-ui-browser.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ide-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      # Use the runner-installed Chrome and its existing Ubuntu AppArmor profile.
      FORGE_UI_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare supported Rust and WASM toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          cargo fetch --manifest-path src/rust/Cargo.toml --locked
          node --version
      - name: Install pinned browser test dependency and verify supported Chrome
        working-directory: src/rust/forge-ide-web/tests/browser
        run: |
          npm ci --ignore-scripts
          google-chrome --version
      - name: Verify QA reporting and failure handling
        run: |
          python3 -B -m unittest discover -s src/rust/scripts/tests -v
          make ui-qa-check
      - name: Build and run headless QA through the root entry point
        env:
          QA_OUTPUT_ROOT: ${{ runner.temp }}/forge-ui-qa
        run: make ui-qa
      - name: Publish sanitized QA summary
        if: always()
        run: |
          for report in "$RUNNER_TEMP"/forge-ui-qa/forge-ui-qa-*/run.md "$RUNNER_TEMP"/forge-ui-qa/forge-ui-qa-*/browser/summary.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; printf '\n' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve only allowlisted QA reports and sanitized fixture screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-ide-browser-qa
          path: |
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/run.json
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/run.md
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/result.json
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/summary.md
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/junit.xml
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/failure.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-desktop.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-narrow-details.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-narrow-declaration.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-partial-problems.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-empty.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-workbench-narrow-denied.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-controlled-timeout.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-controlled-fatal.png
            ${{ runner.temp }}/forge-ui-qa/forge-ui-qa-*/browser/ide-controlled-no-allowed-project.png
          if-no-files-found: ignore
          retention-days: 7
