# Preparation-stage HBA rules (installed as forge-worker-hba.conf when
# migration 52 pg_proxy_preparation is applied and migration 53 is
# not). The six caller roles are admitted via local peer auth
# through the forge-preparation ident map, so the proxy can run and
# be verified BEFORE cutover (the approved pre-cutover proxy
# verification sequence).
#
# pg_hba is first-match: the FIRST matching line decides, and a
# failed authentication does NOT fall through to later rules. These
# peer lines therefore decide every local connection to the six
# roles, so the forge-preparation map also carries the pre-existing
# local callers (forge_agent -> forge_agent; lrocha ->
# forge_coding_worker / forge_coding_reconciler) — with the proxy-only
# map these lines locked those callers out at the preparation stage.
# Direct access is otherwise preserved: there are no reject rules
# here, and the retained host rules below are unchanged.
local forge_agent forge_agent peer map=forge-preparation
local forge_agent forge_coding_worker peer map=forge-preparation
local forge_agent forge_coding_reconciler peer map=forge-preparation
local forge_agent forge_gpu_worker peer map=forge-preparation
local forge_agent muse_proxy_writer peer map=forge-preparation
local forge_agent forge_pg_proxy peer map=forge-preparation
# Retained direct-access host rules (unchanged from pre-preparation).
host forge_agent forge_gpu_worker 127.0.0.1/32 scram-sha-256
host forge_agent muse_events 127.0.0.1/32 scram-sha-256
host all all 127.0.0.1/32 reject
host replication all 127.0.0.1/32 reject
