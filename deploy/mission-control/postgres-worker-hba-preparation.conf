# Preparation-stage HBA rules (installed as forge-worker-hba.conf when
# migration 39 pg_proxy_preparation is applied and migration 40 is not).
# The proxy OS user (forge-pg-proxy) is admitted as each caller role via
# local peer auth through the forge-pg-proxy ident map, so the proxy can
# run and be verified BEFORE cutover (the approved pre-cutover proxy
# verification sequence). Direct access is preserved: there are no
# reject rules here, and non-proxy OS users fall through to the
# distribution's local peer rules and the retained host rules below.
local forge_agent forge_agent peer map=forge-pg-proxy
local forge_agent forge_coding_worker peer map=forge-pg-proxy
local forge_agent forge_coding_reconciler peer map=forge-pg-proxy
local forge_agent forge_gpu_worker peer map=forge-pg-proxy
local forge_agent muse_proxy_writer peer map=forge-pg-proxy
local forge_agent forge_pg_proxy peer map=forge-pg-proxy
# Retained direct-access host rules (unchanged from pre-preparation).
host forge_agent forge_gpu_worker 127.0.0.1/32 scram-sha-256
host forge_agent muse_events 127.0.0.1/32 scram-sha-256
host all all 127.0.0.1/32 reject
host replication all 127.0.0.1/32 reject
