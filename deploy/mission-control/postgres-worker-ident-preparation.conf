# Preparation-stage ident map (map name forge-preparation). Installed
# by setup-postgres.sh into pg_ident.conf (appended once) while the
# preparation migration is applied and cutover is not.
#
# pg_hba is first-match and a FAILED peer authentication does not
# fall through to later rules, so the preparation HBA's peer lines
# decide every local connection to the caller roles. This map
# therefore carries not only the proxy OS user (forge-pg-proxy, the
# six caller roles) but also the pre-existing local callers whose
# access the preparation stage must preserve: the runner's OS user
# (forge_agent -> forge_agent) and the operator's OS user (lrocha ->
# forge_coding_worker / forge_coding_reconciler, the roles the
# claim/finish tooling runs as). Without those three lines the
# preparation stage locks the existing callers out of their own
# database until cutover.
forge-preparation forge-pg-proxy forge_agent
forge-preparation forge-pg-proxy forge_coding_worker
forge-preparation forge-pg-proxy forge_coding_reconciler
forge-preparation forge-pg-proxy forge_gpu_worker
forge-preparation forge-pg-proxy muse_proxy_writer
forge-preparation forge-pg-proxy forge_pg_proxy
forge-preparation forge_agent forge_agent
forge-preparation lrocha forge_coding_worker
forge-preparation lrocha forge_coding_reconciler
