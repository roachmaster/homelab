notes: "The first backlog item: the Postgres proxy cutover criterion deferred from workflow b3a05d8a at Leonardo's direction 2026-11-25. Never filed (same result_mismatch rejection)."
prompt: "Determine and implement the architectural revision that lets the Postgres proxy become the only writer - the deferred acceptance criterion of Forge workflow b3a05d8a, parked at Leonardo's direction on 2026-11-25. Background: the proxy candidate on feature/muse migrates most coordinator stores, but a set of coordinator operations - work_store accept, plan_decide, review_decide, resume, repair, publication_retry, and the workflow process/decide/retry core - invoke Python callbacks mid-transaction for recipe resolution (_authority/resolve_recipe), so they cannot be expressed as the single self-contained operations the proxy contract requires, and the cutover gate refuses. Determine the correct revision of the recipe-resolution contract (candidates include: resolution moved into the database as data and SQL; resolution completed before the transaction opens, with the resolved recipe pinned by digest; a multi-call proxy protocol with idempotency keys) and implement it so the listed operations execute through the proxy with no mid-transaction callbacks, the AST-measured unmigrated-caller guard list shrinks to empty, and the cutover gate's refusal no longer triggers on these callers. Keep the proxy a simple CRUD pass-through per Leonardo's proxy principle: the revision belongs in the callers and the recipe contract, not in proxy internals."
acceptance_criteria: "The chosen revision is recorded on the task with the alternatives considered and why they were rejected; the listed coordinator operations execute through the proxy in tests with no mid-transaction Python callback; the AST-measured unmigrated-caller list is empty and its guard test passes; the cutover gate no longer refuses on unmigrated callers (the gate itself is never run against a live host); recipe resolution behavior is unchanged for existing flows - same recipes selected, same digests - as shown by the existing coordinator suites passing; the proxy service gains no recipe or workflow logic."
