prompt: "Gap: Forge has no sanctioned way to revive a workflow that is both disabled and escalated. The recovery grant predicate requires enabled=true and a non-escalated phase, cancelled tasks are terminal, and the owner-continuation resume fits only one narrow stranded shape. When the coordinator revoked the codex-author delegation on 2026-11-25 it cancelled 15 tasks and disabled 16 workflows; every one of them is stuck with no legitimate path back, even where the plan was already approved with zero findings. GitHub issues #24 and #27 track this gap. A grok-primary attempt to build the fix (workflow beb20249) had its plan approved with 0 findings, but its implement attempt failed on 2026-11-25 (malformed agent output) and that workflow itself escalated - the approved plan is preserved in the pre-reset history export. Implement the recovery path from that approved plan: a guarded revival for disabled+escalated workflows that re-checks the original grants, preserves the approved plan and review record, writes audit events for the revival, and refuses when attempts are live or the plan was never approved."
acceptance_criteria: "A disabled+escalated workflow with an approved plan can be revived through the sanctioned path and resumes work; revival is refused (with a recorded reason) when an attempt is live, the plan was never approved, or the caller's grant does not cover the workflow's profile; every revival writes audit events naming the actor and the prior state; cancelled tasks stay terminal - revival acts on the workflow, not by resurrecting tasks; the two GitHub issues' reproduction cases pass as tests."
