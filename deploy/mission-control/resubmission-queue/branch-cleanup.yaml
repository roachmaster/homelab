prompt: "Clean up the remote branches of roachmaster/homelab. Verified 2026-11-25: the remote carries 35 branches -- main, feature/muse, fix/native-postfix-verification-20261125, and 32 forge/task-<uuid> branches created by the Forge publisher, one per published task, including branches whose work already merged and was never cleaned up. Keep: main and any stable or release branches, and the agents' persistent feature branches (feature/muse today, and feature/<agent> as they are established). Delete the forge/task-* branches and any other branch that is neither stable nor an agent feature branch -- but only after verifying, branch by branch, that the branch tip is reachable from main (its work is merged). Any branch whose tip is not reachable from main must NOT be deleted: list it in the delivery with its tip commit, author, and what work it appears to hold, so the owner can decide. The fix/native-postfix-verification-20261125 branch is the owner's own in-flight work from today: do not delete it regardless of reachability; list it as explicitly preserved pending the owner's word."
acceptance_criteria: "1. Every remote branch is enumerated and classified in the delivery: stable, agent feature, cleanup candidate, or preserved. 2. Each deleted branch's tip was verified reachable from main before deletion, with the verification recorded per branch. 3. No branch whose tip is unreachable from main is deleted; each is listed with its tip commit, author, and apparent contents. 4. main, stable branches, and agent feature branches are untouched, and fix/native-postfix-verification-20261125 is preserved. 5. After cleanup, git ls-remote shows only the kept branches."
