notes: "One of the five failure-derived fixes. Root was awaiting_review (implement) when swept; its repair child 306c3ae4 (merge-conflict repair vs main 0070e78 on test_jenkins_m27_boundary.py) was cancelled - a resubmission restarts from the finished implement, the conflict resolution was not preserved."
prompt: "Stop review-infrastructure failures from cancelling workflows. Verified 2026-11-25 on workflow b3a05d8a: the implement candidate e9c9b89 was submitted and awaiting review when all 21 external review attempts died instantly with 'external review context unavailable'; on exhausting the review retry budget the workflow cancelled itself and all 32 of its open tasks, discarding a finished, gate-green build. A failure to LOAD review context is an infrastructure failure, not a verdict on the candidate. Change the review retry handling so context-load and infrastructure failures are distinguished from review verdicts: they park the review (retry with backoff, then escalate the review step alone for operator attention) and never cancel sibling tasks, the workflow, or a submitted candidate. Verdict-driven paths (revise, approve, exhausted findings) keep their current behavior, including the cancellation semantics that exist today for genuine workflow cancellation."
acceptance_criteria: "1. When external review context cannot be loaded, the review step retries and then escalates alone; the workflow, its sibling tasks, and any submitted candidate remain untouched (no cancelled tasks, workflow not cancelled). 2. A candidate awaiting review during a context outage is reviewed normally once context loads again, with no resubmission. 3. Genuine verdict flows unchanged: revise/approve behavior and explicit user cancellation still cancel exactly what they cancel today. 4. Tests reproduce the b3a05d8a sequence (submitted candidate plus repeated context-load failure) and assert no cascade. 5. All 12 gates green on the candidate."
