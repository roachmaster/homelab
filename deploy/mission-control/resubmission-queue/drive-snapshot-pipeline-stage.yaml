prompt: "Add a final snapshot-refresh stage to the Jenkins pipeline that runs for the homelab main branch only (the main verification pipeline; branch pipelines must not run it). Purpose: keep the Gemini research-bridge snapshot in Google Drive current with main. Today the snapshot is refreshed by hand and goes stale whenever main moves. The stage runs only after every other main-pipeline stage has passed, and it: (1) creates a zip archive of the exact main tip the pipeline just verified, named homelab-main-<short-sha>-<yyyy-mm-dd>.zip; (2) uploads the zip to the top level of the Drive study-notes location (the same location as homelab-docs-updated/); (3) refreshes the extracted copy in the Drive input folder as homelab-main-<short-sha>/ with the full tree; (4) only after the new zip and extracted folder are verified complete (file count and byte total match the archive), removes the previous snapshot zip and extracted folder. All Drive access goes through rclone on the Jenkins host (Mission Control) using the existing remote gdrive in lrocha's rclone config - no interactive authentication, no per-file prompts, and no credentials or tokens in the repo. A Drive or rclone failure must be visible in the build log and build result, and must never leave a half-uploaded snapshot as the only copy in Drive."
acceptance_criteria: "(1) The snapshot stage exists in the main-branch pipeline definition only; branch pipelines do not define or run it. (2) It runs only when all preceding main verification stages pass; on any earlier failure it does not run. (3) The uploaded zip is an archive of the exact main commit the pipeline verified, named homelab-main-<short-sha>-<date>.zip, present at the Drive study-notes top level. (4) The extracted folder homelab-main-<short-sha> in the Drive input folder matches the archive tree (file count and byte total verified before the stage reports success). (5) The previous snapshot zip and folder are removed only after the new snapshot verifies; a failed or interrupted stage leaves the previous snapshot intact. (6) Drive/rclone failures surface in the build log and result metadata. (7) No secrets in the repo; the stage uses the host's existing rclone gdrive config. (8) Existing pipeline tests/checks covering the pipeline definition pass."
