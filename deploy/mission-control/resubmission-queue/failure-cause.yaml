prompt: "Require a cause on failure events. Verified 2026-11-25: workflow 3824445d's round-4 implement attempt (task 51056445) failed after about five minutes and the failed event payload carries no cause at all -- the reason exists only in runner/agent logs on the host for 13:17-13:22 UTC, so the portal and the event stream cannot say why it failed, and the workflow sits escalated with nothing actionable in the record. Change failure production so every task and workflow failed and escalated event carries a bounded cause: a machine-readable cause code plus a short human summary from the failing component (agent exit, tool error, deadline, reconcile reason), attached by the producer at failure time. Surface the cause through the work list/get API so the portal shows it. Historical events are not rewritten."
acceptance_criteria: "1. New failed and escalated events always carry a cause code and summary; the updated producers cannot emit one without (test-enforced). 2. The work list/get API returns the cause and the portal task view displays it for failed and escalated tasks. 3. The 3824445d round-4 sequence reproduced in tests yields a failed event whose payload names the cause without consulting host logs. 4. Cause text is bounded and redacted under the existing payload rules (no secrets, no unbounded logs). 5. All 12 gates green on the candidate."
