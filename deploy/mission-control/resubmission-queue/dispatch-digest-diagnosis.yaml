notes: "Filed from the failed backlog submissions of 2026-11-25 evening: two tasks Leonardo directed were rejected undiagnosably and had to be handed to Codex as text instead."
prompt: "Defect: dispatch rejects submissions with the single opaque code result_mismatch for at least three different causes - a stale base_revision, a stale workflow_policy_digest, and a revoked or rotated agent grant - and a filing agent has no supported way to discover which one applies or what the current values are. Observed 2026-11-25: after the coordinator rotated grants during the codex-author revocation, agy-primary submissions carrying the previously valid policy digest at the verified current main tip were rejected with result_mismatch; retrying with a second profile's digest failed identically, and two backlog filings were lost with no diagnosable signal. Change the dispatch contract so a rejected submitter can tell what to fix: distinct rejection reasons (or a bounded detail field) for stale base vs stale digest vs missing/revoked grant, plus a read-only discovery path by which an authorized profile can learn the current policy digest it is expected to present. Do not leak other profiles' grants or digests beyond what the caller is authorized for."
acceptance_criteria: "A submission with a stale base gets a rejection distinguishable from one with a stale digest, and both are distinguishable from a revoked grant; an authorized profile can discover its own current expected policy digest through a supported read path; rejection details reveal nothing about other profiles; the three observed 2026-11-25 cases are covered by tests; existing clients that only read the result_mismatch code keep working."
