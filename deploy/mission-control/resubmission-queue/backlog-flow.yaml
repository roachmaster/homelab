prompt: "Create a first-class backlog path in Forge. Today, when an acceptance criterion cannot be fulfilled as written - for example because it depends on an architectural change that has not been designed yet - the work has nowhere to go: the workflow cycles revise rounds on the unfulfillable criterion, or the item is mentioned in a report and lost. Add: (1) a backlog marker on submission and on deferral - the dispatch contract and the task record distinguish backlog items from active work, with structured fields captured at filing: summary, origin link (the workflow and task the item was deferred from, when any), reason for deferral, and what unblocks it; (2) a deferral action: a specified acceptance criterion or review finding can be detached from an active workflow and parked as a backlog item linked to its origin, recorded as an audited event, so the parent workflow proceeds on its remaining criteria; (3) an accept-as-is override at either the plan or the candidate review stage that names the parked items and flips a revise verdict to approved, extending the existing external plan approve-override discipline (exact stranded-state checks, explicit accept-as-is confirmation, reason, acceptance reference, expected revision, one-shot idempotency) to candidate reviews; (4) backlog items are inert - they do not run, expire, or block anything - until promoted; promotion turns a backlog item into a normal active task in the plan-implement-review flow, keeping the origin link; (5) the portal lists and badges backlog items distinctly, with a filter, and a workflow shows the items deferred from it; (6) migration and verify coverage following the existing patterns, and the submission API stays backward compatible for non-backlog tasks. Filing or deferring to the backlog must be a single dispatch call with no extra ceremony."
acceptance_criteria: "Dispatch accepts a backlog submission and a deferral, and rejects malformed backlog fields with a clear error; the task record persists the backlog marker, fields, and origin link; deferring a criterion from an active workflow records an audited event and the workflow proceeds on its remaining criteria; an accept-as-is override naming parked items flips a revise verdict at plan stage and at candidate review stage under the existing plan override's exact-state and explicit-confirmation discipline, and is rejected when its preconditions do not hold; backlog items do not run or block until promoted; promotion produces a normal active task keeping the origin link; the portal list API exposes the marker and fields and the UI badges backlog items with a working filter; non-backlog submissions and workflows behave exactly as before; migrations apply cleanly and verify.sql passes at the new version; tests cover filing validation, deferral, override, promotion, and portal exposure."
