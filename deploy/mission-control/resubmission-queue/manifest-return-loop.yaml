prompt: "Defect: the external (muse-db) workflow preparation step can loop forever returning the candidate manifest. Observed 2026-11-25 on workflow b3a05d8a (Postgres proxy): after candidate 13a892d was submitted at base 0070e78, the workflow queued an implement task instructing 'Return the exact candidate manifest at the originally supplied base. Preserve the existing implementation.' Each finish() submitted the identical manifest and, within seconds, the workflow queued the next identical task (rounds 8, 9, 10 - tasks 130f7abf, cc4efcdd, b178c144) with no review intervening. The third was left queued deliberately to break the cycle. Investigate the preparation/manifest-return branch of the external workflow: when the returned manifest matches the candidate already recorded for the workflow, the workflow must advance (to review or completion) instead of queueing another identical implement task, and repeated identical manifest returns must terminate with a recorded reason rather than requeueing."
acceptance_criteria: "Submitting a manifest identical to the workflow's recorded candidate does not queue another implement task; the workflow advances or terminates with a recorded reason; a bounded number of manifest-return rounds is enforced per workflow; the behavior is covered by a test replaying the observed sequence (submit, manifest return, manifest return) and asserting no third identical task is created; genuine base changes still trigger exactly one manifest-return/base-refresh task."
