# Post-cutover HBA rules (installed as forge-worker-hba.conf when
# migration 53 pg_proxy_cutover is applied). Write-capable roles are
# admitted ONLY via local peer auth from the proxy OS user
# (forge-pg-proxy), through the forge-pg-proxy ident map. No TCP
# admission for them; old SCRAM credentials are rotated at cutover.
local forge_agent forge_agent peer map=forge-pg-proxy
local forge_agent forge_coding_worker peer map=forge-pg-proxy
local forge_agent forge_coding_reconciler peer map=forge-pg-proxy
local forge_agent forge_gpu_worker peer map=forge-pg-proxy
local forge_agent muse_proxy_writer peer map=forge-pg-proxy
local forge_agent forge_pg_proxy peer map=forge-pg-proxy
# Any other local OS user is refused for the proxy roles, so the
# distribution's local peer fallback cannot admit them.
local forge_agent forge_agent reject
local forge_agent forge_coding_worker reject
local forge_agent forge_coding_reconciler reject
local forge_agent forge_gpu_worker reject
local forge_agent muse_proxy_writer reject
local forge_agent forge_pg_proxy reject
# muse_events keeps its SCRAM host path (read-only; enforced by grants).
host forge_agent muse_events 127.0.0.1/32 scram-sha-256
host all all 127.0.0.1/32 reject
host replication all 127.0.0.1/32 reject
