nd progress</tspan><tspan x="453.90" dy="24.00">or authentication</tspan></text><rect x="300.22" y="854.00" width="307.19" height="198.00" rx="3" ry="3" fill="#087f8c" stroke="#086975" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="453.82" y="885.00" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#ffffff"><tspan x="453.82" dy="0.00">IMPLEMENTED NARROW</tspan><tspan x="453.82" dy="24.00">NETWORK CHECKPOINT</tspan><tspan x="453.82" dy="24.00">Typed node.info over</tspan><tspan x="453.82" dy="24.00">optional mutual-TLS HTTPS</tspan><tspan x="453.82" dy="24.00">Loopback proof; remote</tspan><tspan x="453.82" dy="24.00">deployment remains</tspan><tspan x="453.82" dy="24.00">future</tspan></text><rect x="295.24" y="1112.00" width="317.08" height="222.00" rx="3" ry="3" fill="#f2f3f5" stroke="#6f7782" stroke-width="1" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><text x="453.78" y="1143.00" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#263442"><tspan x="453.78" dy="0.00">LATER REMOTE</tspan><tspan x="453.78" dy="24.00">EXECUTION GATES</tspan><tspan x="453.78" dy="24.00">Owner authorization,</tspan><tspan x="453.78" dy="24.00">limits, intent-key</tspan><tspan x="453.78" dy="24.00">deduplication</tspan><tspan x="453.78" dy="24.00">Deadline, restart and</tspan><tspan x="453.78" dy="24.00">cancellation semantics; no</tspan><tspan x="453.78" dy="24.00">exactly-once claim</tspan></text></svg>