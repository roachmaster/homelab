ke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="483.47" y="813.00" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#183342"><tspan x="483.47" dy="0.00">PROPOSED PHASE 3 —</tspan><tspan x="483.47" dy="24.00">READ-ONLY FIRST</tspan><tspan x="483.47" dy="24.00">Explicitly configured peers</tspan><tspan x="483.47" dy="24.00">and authenticated node</tspan><tspan x="483.47" dy="24.00">reads</tspan><tspan x="483.47" dy="24.00">Choose transport later;</tspan><tspan x="483.47" dy="24.00">expose stale or unknown</tspan><tspan x="483.47" dy="24.00">outcomes</tspan></text><rect x="324.88" y="1064.00" width="317.08" height="222.00" rx="3" ry="3" fill="#f2f3f5" stroke="#6f7782" stroke-width="1" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><text x="483.42" y="1095.00" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#263442"><tspan x="483.42" dy="0.00">LATER REMOTE</tspan><tspan x="483.42" dy="24.00">EXECUTION GATES</tspan><tspan x="483.42" dy="24.00">Owner authorization,</tspan><tspan x="483.42" dy="24.00">limits, intent-key</tspan><tspan x="483.42" dy="24.00">deduplication</tspan><tspan x="483.42" dy="24.00">Deadline, restart and</tspan><tspan x="483.42" dy="24.00">cancellation semantics; no</tspan><tspan x="483.42" dy="24.00">exactly-once claim</tspan></text></svg>