<title id="title">Forge IDE workbench wireframe — partial report</title>
<desc id="desc">Design-only desktop partial inspection. A file with unavailable Rust structure is selected. Existing diagnostic strings appear in a proposed Problems index without invented compiler severity or precise source location. Other accepted report entries remain browsable.</desc>
